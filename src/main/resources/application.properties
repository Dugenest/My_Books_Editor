# Application Configuration
spring.application.name=My_Books_Editor
server.port=8111

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/My_Books_Editor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.afci=INFO
logging.level.org.springframework.security=WARN

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:secure_password}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=86400000

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# Pagination Configuration
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Configuration pour l'upload de fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Répertoire de stockage des fichiers uploadés
file.upload-dir=uploads

# Chemin de l'avatar par défaut
avatar.default-path=assets/default-avatar.png

# Configuration du répertoire spécifique pour les avatars
avatar.upload-dir=${file.upload-dir}/avatars

# Configuration des ressources statiques
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=file:./uploads/,classpath:/static/